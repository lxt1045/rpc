debug: true
token: "replace-with-a-long-random-token"
max-clients: 1024
max-conns-per-client: 128
metrics-addr: "127.0.0.1:6060"
conn:
  addr: ":18086"
  host: "speedtest.cn"
  enable-tls: true
  read-concurrency: 1
  write-concurrency: 1
  tls:
    ca-cert: "static/ca/root-cert.pem"
    server-cert: "static/ca/server-cert.pem"
    server-key: "static/ca/server-key.pem"
log:
  log-level: info
  to-console: true
  filename: ""
  max-size: 20
  max-backups: 10
  max-age: 30
  compress: true
